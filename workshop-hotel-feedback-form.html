<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hotel Feedback Form</title>
    <style>
      body {
        font-family: Playfair Display, serif;
        margin: 0;
        padding: 0;
      }
      header {
        background-color: #fff;
        color: #000;
        text-align: center;
        padding: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .image { /* div containing the image and h1 */
  display: flex;
  justify-content: center; /* horizontal */
  align-items: center;     /* vertical */
      }

      header img { /* nested image inside the div */
  width: 50px;
  height: auto; }


      main {
        padding: 20px;
      }

      form {
        max-width: 600px;
        margin: 0 auto;
      }

      fieldset {
        border: 1px solid #ccc;
        padding: 10px;
        margin-bottom: 20px;
      }

      legend {
        font-weight: bold;
      }

/* Radios inline */
      input[type="radio"] {
  display: inline-block;   /* side by side */
  margin-right: 10px;      /* spacing between radios */
}

/* Checkboxes stacked vertically */
      input[type="checkbox"] {
  display: block;          /* each on its own line */
  margin-bottom: 5px;      /* spacing between checkboxes */
}




      input[type="text"],
      input[type="email"],
      input[type="number"],
      select,
      textarea {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border-radius: 4px;
        border: 1px solid #ccc;
      }

      button {
        background-color: #000;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        background-color: #45a049;
      }
    </style>
  </head>

  <body>
    <header>
      <div class="image">
        <img src="the-ritz-carlton-logo-png-transparent.png" alt="Hotel Logo"></img>
        <h1>Hotel Feedback Form</h1>
      </div>
      
      
      <p><em>Thank you for staying with us. Please provide feedback on your recent
        stay.</em></p>

      </p>
    </header>

    <main>
      <form method="POST" action="https://hotel-feedback.freecodecamp.org">
        <fieldset>

          <legend>Personal Information</legend>
          <label for="full-name">Name (required):</label>
          <input type="text" id="full-name" name="name" placeholder="e.g., John Doe" required size="20"/>
          <br>
          <label for="email">Email address (required):</label>
          <input
            placeholder="example@email.com"
            required
            id="email"
            type="email"
            name="email"
            size="20"
          />
          <label for="age">Age (optional):</label>
          <input type="number" name="age" id="age" min="3" max="100" />
        </fieldset>

        <fieldset>
          <legend>Was this your first time at our hotel?</legend>
          <input id="yes-option" type="radio" name="hotel-stay" value="yes" />
          <label for="yes-option">Yes</label>
          <input id="no-option" type="radio" name="hotel-stay" value="no" />
          <label for="no-option">No</label>
        </fieldset>

        <fieldset>
          <legend>
            Why did you choose to stay at our hotel? (Check all that apply)
          </legend>

          <input type="checkbox" id="ads" name="choice" value="ads" />
          <label for="ads">Social Media Ads</label>

          <input
            type="checkbox"
            id="recommendation"
            name="choice"
            value="recommendation"
          />
          <label for="recommendation">Personal Recommendation</label>
          
          <input type="checkbox" id="location" name="choice" value="location" />
          <label for="location">Location</label>

          <input
            checked
            type="checkbox"
            id="reputation"
            name="choice"
            value="reputation"
          />
          <label for="reputation">Reputation</label>
          
          <input type="checkbox" id="price" name="choice" value="price" />
          <label for="price">Price</label>
        </fieldset>

        <fieldset>
          <legend>Ratings</legend>

          <label for="service">How was the service?</label>

          <select name="service" id="service">
            <option value="poor">Poor</option>
            <option value="satisfactory">Satisfactory</option>
            <option value="good">Good</option>
            <option value="very-good">Very Good</option>
            <option selected value="excellent">Excellent</option>
          </select>
          <br>
          <label for="food">How was the food?</label>

          <select name="food" id="food">
            <option value="poor">Poor</option>
            <option value="satisfactory">Satisfactory</option>
            <option value="good">Good</option>
            <option value="very-good">Very Good</option>
            <option selected value="excellent">Excellent</option>
          </select>
        </fieldset>

        <label for="comments">Other Comments?</label>

        <textarea id="comments" name="comments" cols="30 rows="10"></textarea>
        <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
