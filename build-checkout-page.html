<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Checkout</h1>

    <Section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="A cube">
        <p>Rubik's Cube</p>
        <p>$29.99</p>
    </Section>
    <Section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name">Cardholder Name <span aria-hidden="true">*</span></label>
            <input type="text" id="card-name" name="card-name" required>
            <label for="card-number">Card Number <span aria-hidden="true">*</span></label>
            <input type="text" id="card-number" name="card-number" required aria-describedby="card-number-help">
            <p id="card-number-help">Please enter your 16-digit card number without spaces or dashes.</p>
            <label for="expiry-date">Expiry Date <span aria-hidden="true">*</span></label>
            <input type="text" id="expiry-date" placeholder="MM/YY" name="expiry-date" required>
            <label for="cvv">CVV <span aria-hidden="true">*</span></label>
            <input type="text" id="cvv" name="cvv" required>
            <button type="submit">Place Order</button>
        </form>
    </Section>
</body>
</html>
